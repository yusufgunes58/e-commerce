spring.application.name=ecommerce

# Datasource
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# HikariCP connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

#jwt
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration=900
app.jwt.refresh-token-expiration=604800
app.jwt.max-session-duration=2592000

#redis
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}

# session
app.security.cookie.access-token-name=access_token
app.security.cookie.refresh-token-name=refresh_token
app.security.cookie.access-token-path=/api
app.security.cookie.refresh-token-path=/api/v1/auth/refresh


# Guest Cart
app.redis.guest-cart.prefix=guest:cart
app.redis.guest-cart.ttl-days=7

# cart session cookie
app.guest-cart.cookie-name=guest_session_id
app.guest-cart.cookie-max-age-days=7



